# .130(localhost minikube)向け接続設定。jar 内 application.properties の
# .129 向けデフォルトを上書きする(Spring Boot が実行ディレクトリの config/ を自動で読む)。
# 構築手順: docs/local-env-setup.md

# Analytics カタログ DB(minikube 内 PG、NodePort 30432)
app.catalog.jdbc-url=jdbc:postgresql://192.168.49.2:30432/scalardb_analytics
app.catalog.username=scalaradmin
app.catalog.password=scalaradmin

# spark-connect(ホスト上の Spark Connect server)
app.spark.remote=sc://localhost:15002

# 外部システム模擬(plan-009): 生テーブル(erp/payroll)の直接 JDBC 更新用
app.external.jdbc-url=jdbc:postgresql://192.168.49.2:30432/erpdb
app.external.username=scalaradmin
app.external.password=scalaradmin
