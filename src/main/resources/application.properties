server.port=8082
spring.application.name=demo-view-writeback

# ScalarDB Analytics カタログ DB(直読)
app.catalog.jdbc-url=jdbc:postgresql://192.168.214.129:5432/scalardb_analytics
app.catalog.username=scalaradmin
app.catalog.password=scalaradmin

# spark-connect(Analytics クエリ実行)
app.spark.remote=sc://192.168.214.129:15002

# ScalarDB Cluster 接続 properties(plan-005 T0。カタログ payload 由来から切替)
app.scalardb.properties=config/scalardb.properties

# 外部システム模擬(plan-009): 生テーブル(erp/payroll)の直接 JDBC 更新用。
# 外部システムは自分の DB を直接書く、の模擬なので Cluster を経由しない
app.external.jdbc-url=jdbc:postgresql://192.168.214.129:5432/erpdb
app.external.username=scalaradmin
app.external.password=scalaradmin
