<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>データ編集 — demo-view-writeback</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Noto Sans CJK JP", sans-serif; font-size: 13px;
         background: #f4f5f7; display: flex; flex-direction: column; height: 100vh; }
  header { background: #2c3e50; color: #fff; padding: 6px 12px; display: flex; gap: 10px; align-items: center; }
  header a { color: #9fc3e8; text-decoration: none; }
  header select { padding: 4px; border: none; border-radius: 3px; min-width: 180px; }
  header button { padding: 5px 12px; border: none; border-radius: 3px; cursor: pointer; background: #3498db; color: #fff; }
  header button.warn { background: #e67e22; }
  #meta { font-size: 11px; opacity: .85; }
  #status { color: #f1c40f; font-size: 12px; }
  #main { flex: 1; overflow: auto; padding: 12px; }
  h3 { margin: 12px 0 6px; font-size: 13px; color: #444; }
  table.grid { border-collapse: collapse; background: #fff; width: 100%; }
  table.grid th, table.grid td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; font-size: 12px; }
  table.grid th { background: #eef1f4; position: sticky; top: 0; }
  table.grid td input { width: 100%; border: 1px solid #bbb; padding: 2px 4px; }
  td.keycol { background: #f7f8fa; color: #555; }
  .badge { font-size: 10px; border-radius: 3px; padding: 1px 5px; color: #fff; margin-left: 4px; }
  .badge.tx { background: #27ae60; } .badge.re { background: #e67e22; }
  td.pending { color: #9a6b00; background: #fdf0d5; font-style: italic; font-size: 12px; }
  .rowbtn { border: none; background: #27ae60; color: #fff; border-radius: 3px; cursor: pointer; padding: 3px 10px; }
  .rowbtn:disabled { background: #bbb; }
  #result { margin: 8px 0; padding: 8px; border-radius: 4px; display: none; font-size: 12px; white-space: pre-wrap; }
  #result.ok { display: block; background: #e8f8ef; border: 1px solid #27ae60; }
  #result.ng { display: block; background: #fdecea; border: 1px solid #c0392b; }
  .qbox { max-height: 220px; overflow: auto; }
  .mono { font-family: Consolas, monospace; font-size: 11px; }
  /* RE キューパネルはデフォルト非表示(demo-cache-writeback と同じトグル方式) */
  body.details-hidden .detail-panel { display: none; }
  #detail-toggle { margin-left: auto; }
</style>
</head>
<body class="details-hidden">
<header>
  <strong>データ編集</strong>
  <select id="viewSelect" onchange="onSelectView()"></select>
  <button onclick="loadRows()">再読込</button>
  <span id="meta"></span>
  <span id="status"></span>
  <button id="detail-toggle" title="RE 配送キュー(outbox / 宛先)の表示を切り替える">RE キューを表示</button>
  <a href="index.html">ホーム</a>
</header>
<div id="main">
  <div id="result"></div>
  <div id="gridWrap">View を選択してください</div>
  <div class="detail-panel">
    <h3>RE outbox (viewmgr.re_outbox)</h3>
    <div class="qbox" id="outbox">—</div>
    <h3>宛先キュー (erp.re_inbox)</h3>
    <div class="qbox" id="inbox">—</div>
  </div>
</div>

<script>
let DEF = null;
let ROWS = [];
const preselect = new URLSearchParams(location.search).get("view");

document.getElementById("detail-toggle").addEventListener("click", ev => {
  const hidden = document.body.classList.toggle("details-hidden");
  ev.target.textContent = hidden ? "RE キューを表示" : "RE キューを隠す";
});

async function api(path, options) {
  const res = await fetch(path, options);
  return res.json();
}

let MODULES = {};   // viewName -> hasModule

async function loadViews() {
  const body = await api("/api/views");
  const sel = document.getElementById("viewSelect");
  sel.innerHTML = `<option value="">— View 選択 —</option>` +
      (body.success ? body.data.map(v =>
          `<option ${v.viewName === preselect ? "selected" : ""}>${v.viewName}</option>`).join("") : "");
  if (body.success) {
    MODULES = Object.fromEntries(body.data.map(v => [v.viewName, !!v.hasModule]));
    if (preselect && !(preselect in MODULES)) {
      setResult(false, `View が見つかりません: ${preselect} — ホームの View 一覧から選び直してください`);
      return;
    }
  }
  if (preselect) onSelectView();
}

function currentView() { return document.getElementById("viewSelect").value; }

async function onSelectView() {
  if (!currentView()) return;
  await loadRows();
}

let LOOKUPS = {};   // viewColumn -> [{value, label}](lookup 付き列のみ)

async function loadRows() {
  const view = currentView();
  if (!view) return;
  const body = await api("/api/views/" + view);
  if (!body.success) { setResult(false, body.message); return; }
  DEF = body.data.definition;
  ROWS = body.data.rows;
  LOOKUPS = {};
  if (DEF.columns.some(c => c.lookup)) {
    const lu = await api(`/api/views/${view}/lookups`);
    if (lu.success) LOOKUPS = lu.data;
  }
  document.getElementById("meta").textContent =
      `refreshed: ${body.data.refreshedAt ? new Date(body.data.refreshedAt).toLocaleString("ja-JP") : "-"} / ${ROWS.length} 行`;
  renderGrid();
  await loadQueues();
}

function lookupLabel(col, v) {
  const opt = (LOOKUPS[col] || []).find(o => String(o.value) === String(v));
  return opt ? opt.label : v;
}

function renderGrid() {
  const cols = DEF.columns.filter(c => c.visible || c.isKey);
  const html = `<table class="grid"><tr>` +
      cols.map(c => `<th>${c.viewColumn}${c.isKey ? " 🔑" : ""}${c.updatable
          ? `<span class="badge ${c.via === "TX" ? "tx" : "re"}">${c.via}</span>` : ""}</th>`).join("") +
      `<th></th></tr>` +
      ROWS.map((row, ri) => `<tr>` + cols.map(c => {
        const v = row[c.viewColumn] ?? "";
        if (v === "UPDATE REQUESTED") {
          // plan-009: 外部システムの承認待ち。確定(SUCCEEDED/REJECTED)までロック
          return `<td class="pending" title="外部システムの許可/却下で自動確定します">⏳ UPDATE REQUESTED</td>`;
        }
        if (c.updatable && c.lookup && LOOKUPS[c.viewColumn]) {
          // 選択値(plan-008): ドロップダウン。表示 = ラベル / 送信値 = キー
          const options = LOOKUPS[c.viewColumn].map(o =>
              `<option value="${o.value}" ${String(o.value) === String(v) ? "selected" : ""}>${o.label}</option>`).join("");
          return `<td><select data-ri="${ri}" data-col="${c.viewColumn}">${options}</select></td>`;
        }
        if (c.updatable) {
          return `<td><input data-ri="${ri}" data-col="${c.viewColumn}" value="${v}"></td>`;
        }
        if (c.lookup && LOOKUPS[c.viewColumn]) {
          return `<td class="${c.isKey ? "keycol" : ""}">${lookupLabel(c.viewColumn, v)}</td>`;
        }
        return `<td class="${c.isKey ? "keycol" : ""}">${v}</td>`;
      }).join("") + `<td><button class="rowbtn" onclick="saveRow(${ri}, this)">保存</button></td></tr>`).join("") +
      `</table>`;
  document.getElementById("gridWrap").innerHTML = html;
}

async function saveRow(ri, btn) {
  btn.disabled = true;
  const row = { ...ROWS[ri] };
  document.querySelectorAll(`input[data-ri="${ri}"], select[data-ri="${ri}"]`).forEach(input => {
    row[input.dataset.col] = input.value;
  });
  const body = await api(`/api/views/${currentView()}/rows`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(row),
  });
  btn.disabled = false;
  if (!body.success) { setResult(false, body.message); return; }
  const d = body.data;
  if (d.result === "committed") {
    setResult(true, `コミット完了 — 変更列: ${d.changed.join(", ")} / TX書込: ${d.txWrites} / REイベント: ${d.reEvents} / View反映行: ${d.viewRowsUpdated ?? 1}`);
  } else if (d.result === "aborted") {
    setResult(false, `更新モジュールにより中断(abort): ${d.reason}`);
  } else {
    setResult(true, d.message || d.result);
  }
  await loadRows();
  await loadQueues();
}

function setResult(ok, text) {
  const el = document.getElementById("result");
  el.className = ok ? "ok" : "ng";
  el.textContent = text;
}

function setStatus(text) { document.getElementById("status").textContent = text; }

// ---- outbox / 宛先キューの俯瞰(ポーリング) ----
function destNamespace() {
  // 選択中 View の RE テーブルの namespace を宛先として使う(無ければ erp)
  const reTable = DEF ? DEF.tables.find(t => t.providerType !== "scalardb") : null;
  return reTable ? reTable.namespace : "erp";
}

async function loadQueues() {
  const ns = destNamespace();
  const body = await api("/api/overview?destNamespace=" + encodeURIComponent(ns));
  if (!body.success) return;
  document.querySelector("h3:nth-of-type(2)").textContent = `宛先キュー (${ns}.re_inbox)`;
  document.getElementById("outbox").innerHTML = queueTable(body.data.outbox);
  document.getElementById("inbox").innerHTML = queueTable(body.data.destInbox);
}

function queueTable(rows) {
  if (!rows || rows.length === 0) return "<i>空</i>";
  const cols = Object.keys(rows[0]);
  return `<table class="grid"><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>` +
      rows.map(r => `<tr>${cols.map(c => {
        let v = r[c] === null || r[c] === undefined ? "" : String(r[c]);
        if (v.length > 120) v = v.substring(0, 120) + "…";
        return `<td class="mono">${v.replace(/</g, "&lt;")}</td>`;
      }).join("")}</tr>`).join("") + "</table>";
}

loadViews();
loadQueues();
setInterval(loadQueues, 3000);
</script>
</body>
</html>
